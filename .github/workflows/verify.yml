name: MiniPost verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minipost-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: '1'

jobs:
  regression:
    name: Import and HTTP regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Node import and request compilation
        run: |
          mkdir -p artifacts
          node --test tests/*.test.mjs 2>&1 | tee artifacts/node-tests.log
      - name: Python proxy and import-to-HTTP regression
        if: ${{ !cancelled() }}
        run: |
          mkdir -p artifacts
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee artifacts/python-tests.log
      - name: Upload regression logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: regression-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 14

  gateway:
    name: Real COM Gateway integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Checkout the specified COM Gateway
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: youkan-man/app-com-transport-gateway
          ref: 6235616ff3d992a60eace5ad011b9e1de13d09ce
          path: .ci/gateway
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Gateway dependencies
        run: python -m pip install ./.ci/gateway
      - name: Postman import through MiniPost to real Gateway
        env:
          GATEWAY_CHECKOUT: ${{ github.workspace }}/.ci/gateway
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/minipost-commit.txt
          git -C .ci/gateway rev-parse HEAD > artifacts/gateway-commit.txt
          python tests/gateway_integration.py 2>&1 | tee artifacts/gateway-integration.log
      - name: Upload Gateway integration logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gateway-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 14

  browser:
    name: Chromium live HTTP E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ARTIFACT_DIR: artifacts/browser
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
          python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print('CHROMIUM=' + p.chromium.executable_path); p.stop()" >> "$GITHUB_ENV"
      - name: Run real browser and loopback HTTP scenarios
        run: |
          mkdir -p artifacts/browser
          python tests/browser_smoke.py 2>&1 | tee artifacts/browser/e2e.log
      - name: Upload screenshots and browser results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-${{ github.run_attempt }}
          path: artifacts/browser/
          retention-days: 14

  docker:
    name: Docker build and HTTP smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and start the app image
        run: |
          mkdir -p artifacts
          docker build --progress=plain -t minipost:ci . 2>&1 | tee artifacts/docker-build.log
          docker run --detach --name minipost-ci -p 127.0.0.1:18080:8080 minipost:ci
      - name: Check health, bundled Collection, static UI and proxy
        run: |
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 --retry-max-time 30 http://127.0.0.1:18080/api/health | tee artifacts/docker-health.json
          curl --fail --silent --show-error http://127.0.0.1:18080/ > artifacts/docker-index.html
          curl --fail --silent --show-error http://127.0.0.1:18080/api/examples/gateway > artifacts/docker-collection.json
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen
          assert json.loads(Path('artifacts/docker-health.json').read_text())['ok'] is True
          assert 'MiniPost' in Path('artifacts/docker-index.html').read_text()
          assert json.loads(Path('artifacts/docker-collection.json').read_text())['item']
          request = Request('http://127.0.0.1:18080/api/request', data=json.dumps({'method': 'GET', 'url': 'http://127.0.0.1:8080/api/health'}).encode(), headers={'Content-Type': 'application/json'})
          with urlopen(request, timeout=10) as response:
              result = json.load(response)
          assert result['ok'] and result['status'] == 200, result
          assert json.loads(result['body'])['ok'] is True
          Path('artifacts/docker-proxy.json').write_text(json.dumps(result, indent=2))
          print('PASS Docker health, static UI, bundled Collection and real HTTP proxy')
          PY
      - name: Capture logs and remove only the test container
        if: ${{ always() }}
        run: |
          mkdir -p artifacts
          if docker container inspect minipost-ci >/dev/null 2>&1; then
            docker logs minipost-ci > artifacts/docker-runtime.log 2>&1
            docker rm --force minipost-ci
          fi
      - name: Upload Docker logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docker-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 14
