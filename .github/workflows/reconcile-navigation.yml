name: Reconcile navigation changes
on:
  push:
    branches: [fix/request-tab-scope-20261016]
    paths: [.github/workflows/reconcile-navigation.yml]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.repository == 'youkan-man/app-like-postman' && github.ref == 'refs/heads/fix/request-tab-scope-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/request-tab-scope-20261016
          fetch-depth: 0
      - shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'MiniPost UI automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          test "$(git rev-parse origin/main)" = '0b181d3e6ccb0f3e6f9e4729492e99f15f2e4f53'
          test "$(git hash-object static/app.js)" = 'c11f593be5454df2f07009030311e0f473548738'
          git merge --no-commit --no-ff origin/main || test -f .git/MERGE_HEAD
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, re
          MAIN='0b181d3e6ccb0f3e6f9e4729492e99f15f2e4f53'
          def main_text(path):return subprocess.check_output(['git','show',f'{MAIN}:{path}'],text=True)
          def sub(s,a,b):
              assert s.count(a)==1,a[:140]
              return s.replace(a,b,1)
          def write(path,s):Path(path).write_text(s)
          ours=subprocess.check_output(['git','show','HEAD:static/app.js'],text=True)
          s=main_text('static/app.js')
          navigation=ours[ours.index("const navigationKey = "):ours.index('let saveTimer,')]
          navigation=sub(navigation,"const navigationKey = 'minipost.navigation.v1';", "const navigationKey = 'minipost.navigation.v1';\nconst editorPageKey = 'minipost.editor.page.v1';")
          navigation=sub(navigation,"try {navigation = normalizeNavigation(JSON.parse(localStorage.getItem(navigationKey)));} catch {}", "try {navigation = normalizeNavigation(JSON.parse(localStorage.getItem(navigationKey)) ?? {editor:localStorage.getItem(editorPageKey)});} catch {}")
          navigation=sub(navigation,"let pane = navigation.editor, side = navigation.sidebar, responseView = navigation.response, selectedCollectionId = '', modalAction = null;", "let pane = 'params', side = navigation.sidebar, responseView = navigation.response, selectedCollectionId = '', modalAction = null;")
          navigation=navigation.replace('{editor:pane, sidebar:side, response:responseView}','{editor:editorPage, sidebar:side, response:responseView}')
          s=sub(s,"let pane = 'params', side = 'collections', responseView = 'pretty', selectedCollectionId = '', modalAction = null;\n",navigation)
          a=s.index("const editorPageKey = 'minipost.editor.page.v1';",s.index('// Disclosure preferences'));b=s.index('function applyEditorPage()',a)
          s=s[:a]+'let editorPage = navigation.editor, pageExpanded = true;\n'+s[b:]
          s=sub(s,"  applyEditorPage(); $('editorContent').scrollTop = 0;", "  applyEditorPage(); $('editorContent').scrollTop = 0; saveNavigation();")
          a=s.index('function renderSidebar() {');b=s.index('function toggleCollapse(',a)
          x=ours.index('function renderSidebar() {');y=ours.index('function toggleCollapse(',x)
          s=s[:a]+ours[x:y]+s[b:]
          s=sub(s,'return {layout, sections: expandedSections};','return {layout, sections: expandedSections, navigation: {editor:editorPage, sidebar:side, response:responseView}};')
          s=sub(s,'  // The complete workspace is written last;', "  if (layout?.navigation) updates.push([navigationKey, JSON.stringify(normalizeNavigation(layout.navigation))]);\n  // The complete workspace is written last;")
          s=sub(s,"  tab.onclick = () => {responseView = tab.dataset.response; renderResponse();};", "  tab.onclick = () => {responseView = tab.dataset.response; renderResponse(); saveNavigation();};\nfor (const tab of $('sidebarTabs').querySelectorAll('[data-sidebar]')) tab.onclick = () => chooseSidebar(tab.dataset.sidebar);")
          s=sub(s,"bindTabStrip($('responseTabs'), '[role=\"tab\"]');", "bindTabStrip($('responseTabs'), '[role=\"tab\"]');\nbindTabStrip($('sidebarTabs'), '[role=\"tab\"]');")
          write('static/app.js',s)
          s=main_text('static/index.html')
          bar='<nav id="sidebarTabs" class="content-tabs sidebar-navigation" role="tablist" aria-label="ワークスペースの表示">'+''.join(f'<button type="button" id="sidebarTabs-{v}" role="tab" data-sidebar="{v}" aria-controls="sidebarContent">{t}</button>' for v,t in [('collections','コレクション'),('environments','環境'),('history','送信履歴')])+'</nav>'
          s=sub(s,'      <aside class="sidebar" aria-label="保存済みデータ">','      <aside class="sidebar" aria-label="保存済みデータ">\n        '+bar)
          write('static/index.html',s)
          write('static/corporate.css',main_text('static/corporate.css'))
          write('static/content-tabs.css',main_text('static/content-tabs.css')+'''\n/* Sidebar pages share the existing finite content navigation, not request tabs. */
          .sidebar-navigation { flex-wrap:wrap; padding:0 6px; border-bottom:1px solid var(--line); background:var(--surface); }
          .sidebar-navigation [role="tab"] {flex:1 1 auto; padding:6px 5px;}
          ''')
          for name in ['browser_smoke','dom_smoke','ui_workbench','ui_settings','ui_edgecases','ui_selection']:
              p=f'tests/{name}.py';s=main_text(p)
              s=re.sub(r"page\.locator\('details\.sidebar-group\[data-group=([a-z]+)\]'\)\.evaluate\('el => el.open = true'\)",r"page.locator('#sidebarTabs [data-sidebar=\1]').click()",s)
              s=s.replace("expect(page.locator('.sidebar-group').first.locator('summary')).to_contain_text('コレクション')", "expect(page.locator('#sidebarTabs [data-sidebar=collections]')).to_have_attribute('aria-selected', 'true')")
              write(p,s)
          s=Path('tests/ui_paging.py').read_text().replace('data-editor-page','data-editor').replace("'responseTabs-pretty'","'response-tab-pretty'")
          s=sub(s,"            collection = {'info':", """            # Preserve the page preference introduced by the already merged PR10.
                      page.evaluate("localStorage.setItem('minipost.editor.page.v1','headers'); localStorage.removeItem('minipost.navigation.v1')")
                      page.reload()
                      expect(page.locator('#editorTabs [data-editor=headers]')).to_have_attribute('aria-selected','true')
                      editor('all')
                      passed('existing editor-page preference migrates without losing the selected page')
          
                      collection = {'info':""")
          s=sub(s,"                    for tab in page.locator(f'#{root} button').all():\n                        b=tab.bounding_box()", "                    for tab in page.locator(f'#{root} button').all():\n                        tab.scroll_into_view_if_needed()\n                        b=tab.bounding_box()")
          s=sub(s,"                page.screenshot(path=str(out/f'paging-{width}.png'),full_page=True)","                page.locator('#responseTabs [aria-selected=true]').scroll_into_view_if_needed()\n                page.screenshot(path=str(out/f'paging-{width}.png'),full_page=True)")
          write('tests/ui_paging.py',s)
          PY
          node --check static/app.js
          python3 -m compileall -q tests
          rm .github/workflows/reconcile-navigation.yml
          git add static tests .github/workflows/reconcile-navigation.yml
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          git commit -m 'Merge main and retain its content paging while restoring sidebar navigation'
          git push origin HEAD:fix/request-tab-scope-20261016
