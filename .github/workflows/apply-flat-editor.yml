name: Apply mobile toolbar visibility fix
on:
  push:
    branches: [fix/flat-request-editor-20261015]
    paths: [.github/workflows/apply-flat-editor.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'youkan-man/app-like-postman' && github.ref == 'refs/heads/fix/flat-request-editor-20261015'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/flat-request-editor-20261015
          fetch-depth: 0
      - shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('static/corporate.css');s=p.read_text()
          old='  :root { --topbar-height:94px; }'
          assert s.count(old)==1
          s=s.replace(old,'  :root[data-theme] { --topbar-height:94px; }')
          p.write_text(s)
          p=Path('tests/ui_workbench.py');s=p.read_text()
          old="                if width <= 820:\n                    expect(page.locator('#navigation')).not_to_be_visible()"
          new="                if width <= 650:\n                    header = page.locator('.topbar').bounding_box()\n                    for control in ['#toggleSidebar', '#addTab', '#import', '#dataActions', '#environment', '#theme']:\n                        rect = page.locator(control).bounding_box()\n                        assert rect and rect['y'] >= 0, (control, rect)\n                        assert rect['y'] + rect['height'] <= header['y'] + header['height'] + 1, (control, rect, header)\n                if width <= 820:\n                    expect(page.locator('#navigation')).not_to_be_visible()"
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          python3 -m compileall -q tests
          git diff --check
          rm .github/workflows/apply-flat-editor.yml
          git add static/corporate.css tests/ui_workbench.py .github/workflows/apply-flat-editor.yml
          git config user.name 'MiniPost UI automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ui): keep both mobile toolbar rows fully visible'
          git fetch origin fix/flat-request-editor-20261015
          git rebase origin/fix/flat-request-editor-20261015
          git push origin HEAD:fix/flat-request-editor-20261015
