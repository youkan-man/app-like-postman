name: Apply scoped category navigation
on:
  push:
    branches: [fix/request-tab-scope-20261016]
    paths: [.github/workflows/apply-page-navigation.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'youkan-man/app-like-postman' && github.ref == 'refs/heads/fix/request-tab-scope-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/request-tab-scope-20261016
          fetch-depth: 0
      - shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git hash-object static/app.js)" = 'af38f12f81ef74be05dbf64f92a489d5ee465f2a'
          python3 - <<'PY'
          from pathlib import Path
          import re
          def sub(s,a,b):
              assert s.count(a)==1,a[:140]
              return s.replace(a,b,1)
          def patch(path,fn):
              p=Path(path);s=p.read_text();out=fn(s);assert out!=s,path;p.write_text(out)
          def tabs(id,label,attr,entries,target):
              return f'<nav id="{id}" class="page-tabs" role="tablist" aria-label="{label}">' + ''.join(f'<button type="button" id="{id}-{v}" role="tab" {attr}="{v}" aria-controls="{target}">{text}</button>' for v,text in entries) + '</nav>'
          edit=tabs('editorTabs','リクエスト設定のカテゴリ','data-editor-page',[('all','すべて'),('params','クエリ'),('headers','ヘッダー'),('authorization','認証'),('body','本文'),('settings','通信設定'),('scripts','スクリプト')],'editorContent')
          side=tabs('sidebarTabs','ワークスペースの表示','data-sidebar',[('collections','コレクション'),('environments','環境'),('history','送信履歴')],'sidebarContent')
          response=tabs('responseTabs','レスポンスの表示','data-response',[('pretty','整形'),('raw','生データ'),('headers','ヘッダー'),('cookies','Cookie'),('preview','プレビュー')],'responseContent')
          def html(s):
              s=sub(s,'      <aside class="sidebar" aria-label="保存済みデータ">','      <aside class="sidebar" aria-label="保存済みデータ">\n        '+side)
              s=sub(s,'          <div id="editorContent"','          '+edit+'\n          <div id="editorContent"')
              a=s.index('<label for="responseMode">');b=s.index('<input id="responseSearch"',a)
              return s[:a]+response+s[b:]
          patch('static/index.html',html)
          def app(s):
              s=sub(s,'import {initWorkbench, bindItemMenu,','import {initWorkbench, bindTabStrip, bindItemMenu,')
              s=sub(s,"let pane = 'params', side = 'collections', responseView = 'pretty', selectedCollectionId = '', modalAction = null;", """const navigationKey = 'minipost.navigation.v1';
          function normalizeNavigation(value) {
            const allowed = {
              editor: ['all','params','headers','authorization','body','settings','scripts'],
              sidebar: ['collections','environments','history'],
              response: ['pretty','raw','headers','cookies','preview']
            };
            return Object.fromEntries(Object.entries(allowed).map(([key, values]) => [key, values.includes(value?.[key]) ? value[key] : values[0]]));
          }
          let navigation = normalizeNavigation(null);
          try {navigation = normalizeNavigation(JSON.parse(localStorage.getItem(navigationKey)));} catch {}
          let pane = navigation.editor, side = navigation.sidebar, responseView = navigation.response, selectedCollectionId = '', modalAction = null;
          const sidebarSearch = {collections:'', environments:'', history:''};
          const sidebarScroll = {collections:0, environments:0, history:0};
          function saveNavigation() {
            try {localStorage.setItem(navigationKey, JSON.stringify({editor:pane, sidebar:side, response:responseView}));}
            catch {toast('表示状態を保存できません。入力内容は維持しています。');}
          }
          function selectPageTab(id, attribute, value, panelId) {
            for (const tab of $(id).querySelectorAll('button[role=tab]')) {
              const selected = tab.getAttribute(attribute) === value;
              tab.setAttribute('aria-selected', String(selected));
              tab.tabIndex = selected ? 0 : -1;
              if (selected) {$(panelId).setAttribute('aria-labelledby', tab.id);}
            }
            $(panelId).setAttribute('role', 'tabpanel');
          }""")
              s=sub(s,"  root.scrollTop = scrollTop;\n  updateCounts();\n}\nasync function chooseFiles", """  root.scrollTop = scrollTop;
            applyEditorPage();
            updateCounts();
          }
          function applyEditorPage() {
            for (const section of $('editorContent').querySelectorAll('.editor-section')) {
              section.hidden = pane !== 'all' && section.dataset.pane !== pane;
            }
            selectPageTab('editorTabs', 'data-editor-page', pane, 'editorContent');
          }
          function chooseEditorPage(name) {
            pane = name;
            applyEditorPage();
            const section = $('editorContent').querySelector(`[data-pane="${pane}"]`);
            if (section?.querySelector('.editor-section-body').hidden) setSectionExpanded(section, true);
            $('editorContent').scrollTop = 0;
            saveNavigation();
          }
          async function chooseFiles""")
              a=s.index('function renderSidebar() {');b=s.index('function toggleCollapse(',a)
              s=s[:a]+"""function renderSidebar() {
            const root = $('sidebarContent'), previous = root.dataset.side;
            if (previous && previous !== side) {
              sidebarSearch[previous] = $('search').value;
              sidebarScroll[previous] = root.scrollTop;
              $('search').value = sidebarSearch[side];
            }
            const scrollTop = previous === side ? root.scrollTop : sidebarScroll[side];
            renderSidebarSection();
            root.dataset.side = side;
            root.scrollTop = scrollTop;
            selectPageTab('sidebarTabs', 'data-sidebar', side, 'sidebarContent');
          }
          function chooseSidebar(name) {
            side = name;
            renderSidebar();
            saveNavigation();
          }
          """+s[b:]
              s=sub(s,'return {layout, sections: expandedSections};','return {layout, sections: expandedSections, navigation: {editor:pane, sidebar:side, response:responseView}};')
              s=sub(s,'  // The complete workspace is written last;',"  if (layout?.navigation) updates.push([navigationKey, JSON.stringify(normalizeNavigation(layout.navigation))]);\n  // The complete workspace is written last;")
              s=sub(s,"  $('responseMode').value = responseView;","  selectPageTab('responseTabs', 'data-response', responseView, 'responseContent');")
              s=sub(s,"$('responseMode').onchange = () => {responseView = $('responseMode').value; renderResponse();};","""for (const tab of $('editorTabs').querySelectorAll('[data-editor-page]')) tab.onclick = () => chooseEditorPage(tab.dataset.editorPage);
          for (const tab of $('sidebarTabs').querySelectorAll('[data-sidebar]')) tab.onclick = () => chooseSidebar(tab.dataset.sidebar);
          for (const tab of $('responseTabs').querySelectorAll('[data-response]')) tab.onclick = () => {
            responseView = tab.dataset.response;
            renderResponse();
            saveNavigation();
          };""")
              s=sub(s,'workbench = initWorkbench(); bindItemMenu(); bindSurface();',"""workbench = initWorkbench(); bindItemMenu(); bindSurface();
          bindTabStrip($('editorTabs'), '[data-editor-page]');
          bindTabStrip($('sidebarTabs'), '[data-sidebar]');
          bindTabStrip($('responseTabs'), '[data-response]');""")
              return s.replace('// Flat, always-visible sections replace cards and tab-based editors.','// Only the opened-request tab strip is removed; local category paging remains available.')
          patch('static/app.js',app)
          css="""
          /* Fixed category selectors are not a growing list of opened requests. */
          .page-tabs {
            display:flex;
            flex:0 0 auto;
            flex-wrap:wrap;
            align-items:stretch;
            gap:0;
            min-width:0;
            border-bottom:1px solid var(--line);
            background:var(--surface);
          }
          .page-tabs > button {
            appearance:none;
            border:0;
            border-bottom:2px solid transparent;
            border-radius:0;
            margin:0;
            min-height:34px;
            padding:6px 10px;
            background:transparent;
            color:var(--muted);
            font-weight:600;
            font-family:inherit;
            font-size:.92rem;
            line-height:1.35;
            white-space:nowrap;
          }
          .page-tabs > button:hover {background:var(--hover); color:var(--text);}
          .page-tabs > button[aria-selected=true] {border-bottom-color:var(--accent); color:var(--accent);}
          #sidebarTabs {padding:0 6px;}
          #sidebarTabs > button {flex:1 1 auto; padding:6px 5px;}
          #editorTabs {margin:0 16px;}
          #editorContent > .editor-section:not([hidden]) {border-radius:0;}
          .response-toolbar {flex-wrap:wrap;}
          #responseTabs {border-bottom:0; flex:1 1 auto;}
          .response-toolbar #responseSearch {flex:0 1 220px; min-width:100px;}
          @media(max-width:820px) {#editorTabs {margin:0 9px;}}
          @media(max-width:650px) {
            .page-tabs > button {padding:6px 8px;}
            #responseTabs {flex-basis:100%;}
            .response-toolbar #responseSearch {width:100%; flex-basis:100%;}
          }
          """
          patch('static/corporate.css',lambda s:s+css)
          for p in Path('tests').glob('*.py'):
              s=p.read_text()
              s=re.sub(r"page\.locator\('details\.sidebar-group\[data-group=([a-z]+)\]'\)\.evaluate\('el => el.open = true'\)",r"page.locator('#sidebarTabs [data-sidebar=\1]').click()",s)
              s=re.sub(r"page\.locator\('#responseMode'\)\.select_option\('([a-z]+)'\)",r"page.locator('#responseTabs [data-response=\1]').click()",s)
              s=s.replace("page.locator('#responseMode').focus()","page.locator('#responseTabs [aria-selected=true]').focus()")
              s=re.sub(r"expect\(page\.locator\('#responseMode'\)\)\.to_have_value\('([a-z]+)'\)",r"expect(page.locator('#responseTabs [data-response=\1]')).to_have_attribute('aria-selected','true')",s)
              s=s.replace("expect(page.locator('.sidebar-group').first.locator('summary')).to_contain_text('コレクション')","expect(page.locator('#sidebarTabs [data-sidebar=collections]')).to_have_attribute('aria-selected', 'true')")
              s=s.replace("'#editorTabs, #responseTabs, #requestTabs, .request-tab'","'#requestTabs, .request-tab'")
              s=s.replace("expect(page.locator('#editorTabs, [role=tab]')).to_have_count(0)","expect(page.locator('#editorTabs [role=tab]')).to_have_count(7)")
              s=s.replace("expect(page.locator('#responseTabs, [data-response]')).to_have_count(0)","expect(page.locator('#responseTabs [role=tab]')).to_have_count(5)")
              s=s.replace("passed('response format changes without tabs')","passed('response display paging without an opened-request tab strip')")
              p.write_text(s)
          p=Path('README.md');s=p.read_text();s=s.replace('リクエスト編集とレスポンスのタブ切替はありません。','開いたリクエストを上部に溜めるタブ列は設けません。設定カテゴリ・レスポンス表示・サイドバーのページ切替は使用できます。「すべて」では現在の余白のまま各設定を折りたためます。');p.write_text(s)
          PY
          node --check static/app.js
          python3 -m compileall -q tests
          git diff --check
          rm .github/workflows/apply-page-navigation.yml
          git add static README.md tests .github/workflows/apply-page-navigation.yml
          git config user.name 'MiniPost UI automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ui): restore category paging without opened-request tabs'
          git fetch origin fix/request-tab-scope-20261016
          git rebase origin/fix/request-tab-scope-20261016
          git push origin HEAD:fix/request-tab-scope-20261016
