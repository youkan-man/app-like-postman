name: Apply reviewed workspace feature patch
on:
  push:
    branches: [feat/workspace-relations-20261016]
    paths: [.github/workflows/apply-workspace-feature.yml]
permissions:
  contents: write
concurrency:
  group: minipost-apply-workspace-feature
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/workspace-relations-20261016'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify transferred patch and apply only to the feature branch
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/feat/workspace-relations-20261016
          git merge-base --is-ancestor 83b65ae6d33825ce1f28c3ee24bbe7cae8903170 HEAD
          python3 - <<'PY'
          import hashlib, lzma, pathlib
          pieces = sorted(pathlib.Path('.github/temporary-workspace').glob('part-*.xz'))
          assert len(pieces) == 10
          packed = b''.join(p.read_bytes() for p in pieces)
          assert hashlib.sha256(packed).hexdigest() == '2af4febfe478dc42520bb0e771da90c083460da963f6b404ab1e339d422d54f9'
          patch = lzma.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == '3cb66b41c7da57d4fed9cd763b667add614b6800781c9d9e5ff2879b62fef9a4'
          pathlib.Path('/tmp/minipost-workspace.patch').write_bytes(patch)
          PY
          git apply --index --check /tmp/minipost-workspace.patch
          git apply --index /tmp/minipost-workspace.patch
          git rm -r .github/temporary-workspace .github/workflows/apply-workspace-feature.yml
          git diff --cached --check
          git config user.name 'MiniPost source transfer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: contextual workspace creation, variables, scripts and request relations'
          base="$GITHUB_SHA"
          for attempt in 1 2 3; do
            git fetch origin refs/heads/feat/workspace-relations-20261016
            remote=$(git rev-parse FETCH_HEAD)
            git merge-base --is-ancestor "$base" "$remote"
            git diff --name-only "$base" "$remote" > /tmp/concurrent-paths
            python3 - <<'PY'
          from pathlib import Path
          paths=Path('/tmp/concurrent-paths').read_text().splitlines()
          assert all(p.startswith('.local_relay/results/') for p in paths), 'Concurrent non-result changes: stop and reconcile manually'
          PY
            if [ "$base" != "$remote" ]; then
              git rebase --onto "$remote" "$base"
              base="$remote"
            fi
            if git push origin HEAD:refs/heads/feat/workspace-relations-20261016; then exit 0; fi
          done
          exit 1
