name: Apply verified storage repair
on:
  push:
    branches: [feat/workspace-relations-20261016]
    paths: [.github/workflows/apply-storage-repair.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Apply checksum-verified source patch
        shell: bash
        run: |
          git show 6de0c9886ea579c8dda02adafbe3dad8c228d631:.github/workflows/apply-storage-repair.yml > /tmp/storage-transfer.yml
          python - <<'PY'
          import base64, hashlib, pathlib, re, zlib
          text = pathlib.Path('/tmp/storage-transfer.yml').read_text()
          encoded = re.search(r"encoded = '''(.*?)'''", text, re.S).group(1)
          patch = zlib.decompress(base64.b64decode(''.join(encoded.split()), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'eebb22b5d33e144001e5be52b5de3e476763967bf3c6471de533078492ade158'
          pathlib.Path('/tmp/minipost-storage.patch').write_bytes(patch)
          PY
          git apply --check --index /tmp/minipost-storage.patch
          git apply --index /tmp/minipost-storage.patch
          git restore --source=HEAD --staged --worktree -- .github/workflows/verify.yml
          git diff --cached --check
      - name: Verify repaired source
        shell: bash
        run: |
          node --test tests/*.test.mjs
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m py_compile tests/ui_storage.py
      - name: Preserve unrelated relay results and publish application
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: durable browser storage and atomic server backup restoration'
          git fetch origin refs/heads/feat/workspace-relations-20261016
          python - <<'PY'
          import os, subprocess
          subprocess.run(['git', 'merge-base', '--is-ancestor', os.environ['SOURCE_SHA'], 'FETCH_HEAD'], check=True)
          changed = subprocess.check_output(['git', 'diff', '--name-only', os.environ['SOURCE_SHA'], 'FETCH_HEAD'], text=True).splitlines()
          assert all(p.startswith('.local_relay/results/') for p in changed), 'Concurrent application changes require review'
          PY
          git rebase FETCH_HEAD
          git push origin HEAD:refs/heads/feat/workspace-relations-20261016
