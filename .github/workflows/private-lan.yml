name: MiniPost private LAN verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minipost-private-lan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: '1'

jobs:
  private-lan:
    name: Separate LAN peer and overlapping subnet
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Record source and test diagnostic helpers
        run: |
          mkdir -p artifacts/private-lan
          git rev-parse HEAD > artifacts/private-lan/tested-commit.txt
          git archive --format=zip --output=artifacts/private-lan/tested-source.zip HEAD app.py network.py static tests tools examples Dockerfile docker-compose.yml docker-compose.host.yml docker-compose.subnet.yml PRIVATE_LAN.md .github/workflows/private-lan.yml
          sha256sum artifacts/private-lan/tested-source.zip > artifacts/private-lan/tested-source.sha256
          python -m unittest discover -s tests -p 'test_diagnose_network.py' -v 2>&1 | tee artifacts/private-lan/diagnostic-tests.log
      - name: Real Docker to synthetic LAN peer with overlap reproduction
        run: |
          command -v ip
          docker compose version
          sudo env ARTIFACT_DIR="$PWD/artifacts/private-lan" PYTHONUNBUFFERED=1 "$(command -v python)" tests/docker_private_lan.py 2>&1 | tee artifacts/private-lan/test.log
      - name: Keep LAN topology and diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: private-lan-${{ github.run_attempt }}
          path: artifacts/private-lan/
          retention-days: 14
