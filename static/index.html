<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>MiniPost</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/settings.css">
  <link rel="stylesheet" href="/selection.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <button id="toggleSidebar" class="icon-button" aria-label="一覧の開閉" aria-controls="navigation" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
    <strong class="brand"><span class="brand-mark" aria-hidden="true">↗</span>MiniPost</strong>
    <button id="import" class="button">Import</button>
    <span class="top-spacer"></span>
    <div class="env-picker"><label for="environment">環境</label><select id="environment" aria-label="選択中の環境"></select></div>
    <button id="layoutToggle" class="icon-button" aria-label="リクエストとレスポンスを左右に並べる" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg></button>
    <button id="theme" class="icon-button" title="明るさを切り替え" aria-label="明るさを切り替え"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 13A8.5 8.5 0 0 1 11 3.5 8.5 8.5 0 1 0 20.5 13Z"/></svg></button>
  </header>
  <div id="navBackdrop" class="nav-backdrop" hidden></div>
  <div class="workspace">
    <div id="navigation" class="navigation">
      <nav class="rail" aria-label="ワークスペース">
        <button data-sidebar="collections" class="rail-button active" aria-label="コレクション"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h7l2 2h9v11H3zM3 7V4h7l2 2h9"/></svg>コレクション</button>
        <button data-sidebar="environments" class="rail-button" aria-label="環境"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg>環境</button>
        <button data-sidebar="history" class="rail-button" aria-label="履歴"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2 7M3 4v7h7M12 7v6l4 2"/></svg>履歴</button>
      </nav>
      <aside class="sidebar" aria-label="コレクション一覧">
        <div class="sidebar-tools"><input id="search" type="search" placeholder="検索" aria-label="サイドバーを検索"><button id="sidebarAdd" class="icon-button" title="新規作成" aria-label="新規作成">＋</button><button id="clearHistory" class="icon-button" title="履歴を削除" aria-label="履歴を削除" hidden>⌫</button><button id="navClose" class="icon-button" aria-label="一覧を閉じる" hidden>×</button></div>
        <div id="sidebarContent" class="sidebar-content"></div>
        <div class="sidebar-footer"><button id="gatewayExample" class="text-button">＋ COM Gateway サンプル</button></div>
      </aside>
    </div>
    <div id="sidebarResize" class="sidebar-resize" role="separator" aria-label="サイドバー幅" aria-orientation="vertical" aria-valuemin="200" aria-valuemax="520" tabindex="0"></div>
    <main class="main">
      <div id="exchange" class="exchange">
        <section class="request-editor" aria-label="リクエスト編集">
          <div class="request-title"><span id="breadcrumb"></span><input id="requestName" aria-label="リクエスト名" value="Untitled request"><span id="requestDirty" class="dirty-dot" role="status"></span><button id="addTab" class="icon-button" aria-label="新しいリクエスト" title="新しいリクエスト">＋</button><button id="requestHistory" class="button" title="選択中の設定の変更履歴">変更履歴</button><button id="saveRequest" class="button">保存</button><button id="duplicateRequest" class="icon-button" aria-label="編集中のリクエストを複製" title="編集中のリクエストを複製">⧉</button></div>
          <div class="urlbar"><select id="method" aria-label="HTTPメソッド"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option><option>HEAD</option><option>OPTIONS</option></select><input id="url" placeholder="https://api.example.com" spellcheck="false" aria-label="リクエストURL"><button id="send" class="button primary">Send</button></div>
          <div id="editorTabs" class="editor-tabs" role="tablist" aria-label="リクエスト設定"><button data-pane="params" class="active" role="tab">Params <span id="paramsCount"></span></button><button data-pane="authorization" role="tab">Authorization</button><button data-pane="headers" role="tab">Headers <span id="headersCount"></span></button><button data-pane="body" role="tab">Body <span id="bodyDot"></span></button><button data-pane="scripts" role="tab">Scripts <span id="scriptDot"></span></button><button data-pane="settings" role="tab">Settings</button></div>
          <div id="requestWarning" class="warning" role="status" hidden></div>
          <div id="editorContent" class="editor-content" role="tabpanel"></div>
        </section>
        <div id="responseResize" class="response-resize" role="separator" aria-label="リクエストとレスポンスの区切り" aria-orientation="horizontal" aria-valuemin="25" aria-valuemax="75" tabindex="0"></div>
        <section class="response-panel" aria-label="レスポンス">
          <div class="response-heading"><strong>Response</strong><span id="responseStatus" class="response-status" role="status">未送信</span><span id="responseTime" class="metric"></span><span id="responseSize" class="metric"></span><span class="top-spacer"></span><button id="wrapResponse" class="icon-button" aria-label="レスポンスを折り返す" title="折り返し" aria-pressed="true">↵</button><button id="copyResponse" class="text-button">Copy</button><button id="downloadResponse" class="text-button">Save</button></div>
          <div class="response-toolbar"><div id="responseTabs" class="segmented" role="tablist" aria-label="レスポンス表示"><button data-response="pretty" class="active" role="tab">Pretty</button><button data-response="raw" role="tab">Raw</button><button data-response="headers" role="tab">Headers</button><button data-response="cookies" role="tab">Cookies</button><button data-response="preview" role="tab">Preview</button></div><input id="responseSearch" type="search" placeholder="検索" aria-label="レスポンス内検索"></div>
          <div id="responseContent" class="response-content" role="tabpanel"></div>
        </section>
      </div>
      <footer class="statusbar"><span id="connectionStatus">接続中…</span><span id="requestInfo"></span><span class="top-spacer"></span><span id="saveState" role="status">ローカル保存</span><span id="tlsStatus">TLS OFF</span></footer>
    </main>
  </div>
  <dialog id="modal" aria-labelledby="modalTitle"><form id="modalForm"><div class="dialog-heading"><h2 id="modalTitle"></h2><button type="button" id="closeModal" class="icon-button" aria-label="閉じる">×</button></div><div id="modalBody"></div><div class="dialog-footer"><span id="modalMessage" role="status"></span><button type="button" id="cancelModal" class="button">キャンセル</button><button type="submit" id="modalSubmit" class="button primary">保存</button></div></form></dialog>
  <div id="itemMenu" class="item-menu" role="menu" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <input id="importFiles" type="file" accept=".json,application/json" multiple hidden>
</body>
</html>
