<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>MiniPost · API workspace</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <span class="brand-mark">M</span><strong class="brand">MiniPost</strong><span class="top-separator"></span><span class="workspace-label">API workspace</span>
    <button id="newRequest" class="button small">＋ New</button><button id="import" class="button small">Import</button>
    <span class="top-spacer"></span><span id="saveState" class="muted save-state" role="status">ローカル自動保存</span>
    <button id="theme" class="icon-button" title="明るさを切り替え" aria-label="明るさを切り替え">◐</button>
  </header>
  <div class="workspace">
    <nav class="rail" aria-label="ワークスペース">
      <button data-sidebar="collections" class="rail-button active"><span>▤</span>Collections</button>
      <button data-sidebar="environments" class="rail-button"><span>◫</span>Environments</button>
      <button data-sidebar="history" class="rail-button"><span>◷</span>History</button>
    </nav>
    <aside class="sidebar">
      <div class="sidebar-heading"><strong id="sidebarTitle">Collections</strong><button id="sidebarAdd" class="icon-button" title="新規作成" aria-label="新規作成">＋</button><button id="sidebarMore" class="icon-button" title="変数 / エクスポート" aria-label="変数 / エクスポート">⋯</button></div>
      <div class="search-wrap"><input id="search" type="search" placeholder="コレクションを検索" aria-label="サイドバーを検索"></div>
      <div id="sidebarContent" class="sidebar-content"></div>
      <div class="sidebar-footer"><button id="gatewayExample" class="text-button">＋ COM Gateway サンプル</button></div>
    </aside>
    <div id="sidebarResize" class="sidebar-resize" role="separator" aria-label="サイドバー幅" aria-orientation="vertical" tabindex="0"></div>
    <main class="main">
      <div class="workspace-toolbar"><div id="requestTabs" class="request-tabs" role="tablist" aria-label="リクエスト"></div><button id="addTab" class="icon-button" aria-label="新しいリクエスト">＋</button><div class="env-picker"><span class="env-dot"></span><select id="environment" aria-label="選択中の環境"></select><button id="editEnvironment" class="icon-button" title="環境変数" aria-label="環境変数">◫</button></div></div>
      <section class="request-editor">
        <div class="request-title"><span id="breadcrumb" class="muted"></span><input id="requestName" aria-label="リクエスト名" value="Untitled request"><button id="saveRequest" class="button small">保存</button><button id="duplicateRequest" class="icon-button" aria-label="リクエストを複製" title="複製">⧉</button></div>
        <div class="urlbar"><select id="method" aria-label="HTTPメソッド"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option><option>HEAD</option><option>OPTIONS</option></select><input id="url" placeholder="URLを入力、または {{baseUrl}}/api/ports" spellcheck="false" aria-label="リクエストURL"><button id="send" class="button primary">Send <kbd>⌘ ↵</kbd></button></div>
        <div class="editor-tabs" role="tablist" aria-label="リクエスト設定"><button data-pane="params" class="active" role="tab">Params <span id="paramsCount"></span></button><button data-pane="authorization" role="tab">Authorization</button><button data-pane="headers" role="tab">Headers <span id="headersCount"></span></button><button data-pane="body" role="tab">Body <span id="bodyDot"></span></button><button data-pane="scripts" role="tab">Scripts <span id="scriptDot"></span></button><button data-pane="settings" role="tab">Settings</button></div>
        <div id="requestWarning" class="warning" hidden></div>
        <div id="editorContent" class="editor-content"></div>
      </section>
      <div id="responseResize" class="response-resize" role="separator" aria-label="リクエストとレスポンスの高さ" aria-orientation="horizontal" tabindex="0"></div>
      <section class="response-panel">
        <div class="response-heading"><strong>Response</strong><span id="responseStatus" class="response-status">未送信</span><span id="responseTime" class="metric"></span><span id="responseSize" class="metric"></span><span class="top-spacer"></span><button id="copyResponse" class="text-button">Copy</button><button id="downloadResponse" class="text-button">Save response</button></div>
        <div class="response-toolbar"><div id="responseTabs" class="segmented"><button data-response="pretty" class="active">Pretty</button><button data-response="raw">Raw</button><button data-response="headers">Headers</button><button data-response="cookies">Cookies</button><button data-response="preview">Preview</button></div><input id="responseSearch" type="search" placeholder="レスポンスを検索" aria-label="レスポンス内検索"></div>
        <div id="responseContent" class="response-content"></div>
      </section>
      <footer class="statusbar"><span id="connectionStatus"><span class="status-dot"></span> Python proxy</span><span id="requestInfo">Ctrl / ⌘ + Enter で送信</span><span class="top-spacer"></span><span id="tlsStatus">TLS verification OFF</span></footer>
    </main>
  </div>
  <dialog id="modal"><form id="modalForm"><div class="dialog-heading"><h2 id="modalTitle"></h2><button type="button" id="closeModal" class="icon-button" aria-label="閉じる">×</button></div><div id="modalBody"></div><div class="dialog-footer"><span id="modalMessage" role="status"></span><button type="button" id="cancelModal" class="button">閉じる</button><button type="submit" id="modalSubmit" class="button primary">保存</button></div></form></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <input id="importFiles" type="file" accept=".json,application/json" multiple hidden>
</body>
</html>
